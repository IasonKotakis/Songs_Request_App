<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Requests</title>
  <script>
    // Pick the theme before the page draws: the guest's saved choice, else their phone's setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var light = saved ? saved === 'light' : window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <style>
    /* Dark theme (default): dark grey, the same grey as the paper in the dark invite (#1e1e20) */
    :root { color-scheme: dark; --bg: #1e1e20; --card: rgba(40, 40, 43, .92); --field: #18181a; --line: #3a3a3e; --hover: #2f2f33; --text: #f3f1ec; --muted: #a8a39b;
      --accent: #ff6a3d; --accent2: #7d9cdc; --ok: #3ccf7e; --err: #ff6b6b; --on-accent: #fff;
      --glow: none; --photo-filter: none; }
    /* Light theme: warm, to sit with the white/beige photo */
    /* Light theme: the invite's paper, orange, green and blue */
    :root[data-theme="light"] { color-scheme: light; --bg: #f0ece1; --card: rgba(250, 247, 240, .9); --field: #fffdf8; --line: #e0d8c8; --hover: #f3ecdf; --text: #2b211a; --muted: #75685a;
      --accent: #e04e1a; --accent2: #5b7fc7; --ok: #1e8f4e; --err: #c0392b;
      --glow: none;
      --photo-filter: none; }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text); background: var(--glow), var(--bg); }
    /* The party invite (public/background.jpg) across the top, fading into the page. Dimmed in dark mode. */
    .poster { display: block; width: calc(100% + 32px); max-width: none; margin: -56px -16px 0; filter: var(--photo-filter);
      -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
    @media (min-width: 600px) {
      .poster { -webkit-mask-image: linear-gradient(#000 75%, transparent), linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
        mask-image: linear-gradient(#000 75%, transparent), linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
        -webkit-mask-composite: source-in; mask-composite: intersect; }
    }
    /* The invite has a light and a dark version (beige paper / dark grey paper). */
    :root[data-theme="light"] .poster-dark, :root:not([data-theme="light"]) .poster-light { display: none; }
    .has-poster .intro { position: relative; margin-top: -72px; }
    .has-poster h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* the invite already says it */
    .theme-toggle { position: fixed; top: 12px; right: 12px; z-index: 10; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--card); color: var(--text); font-size: 1.15rem; cursor: pointer; display: grid; place-items: center; padding: 0;
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    main { max-width: 440px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.9rem; margin: 0 0 4px; line-height: 1.15; }
    h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    main { padding-top: 56px; }
    form { background: var(--card); border-radius: 18px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.25); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    label, .label { display: block; font-size: .85rem; font-weight: 600; margin: 18px 0 6px; color: var(--muted); }
    label:first-child { margin-top: 0; }
    input, textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); color: var(--text); font-size: 1rem; }
    input:focus, textarea:focus { outline: 2px solid var(--accent2); border-color: transparent; }
    textarea { resize: vertical; min-height: 60px; }
    .opt { font-weight: 400; opacity: .7; }
    .hp { position: absolute; left: -9999px; }
    [hidden] { display: none !important; }

    /* Song rows: used by search results and "Your list" */
    .songs { list-style: none; margin: 6px 0 0; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); }
    .results { max-height: 360px; overflow-y: auto; }
    .songs li { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; }
    .results li[data-i] { cursor: pointer; }
    .results li[data-i]:hover, .results li.active { background: var(--hover); }
    .songs li.info { color: var(--muted); font-size: .9rem; display: block; }
    .art { width: 44px; height: 44px; border-radius: 6px; flex: none; background: var(--hover); object-fit: cover; display: grid; place-items: center; color: var(--muted); font-size: 1.2rem; }
    .meta { min-width: 0; flex: 1; }
    .meta b, .meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta span { color: var(--muted); font-size: .85rem; }
    .meta .e, .meta .clean, .e, .clean { display: inline-block; white-space: nowrap; font-size: .65rem; font-weight: 700; border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: 2px; }
    .e { background: var(--text); color: var(--field); }
    .clean { border: 1px solid var(--muted); color: var(--muted); }
    .icon { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: .95rem; cursor: pointer; display: grid; place-items: center; padding: 0; }
    .icon:hover { border-color: var(--accent2); }
    .icon.playing { background: var(--accent2); border-color: var(--accent2); }
    .icon.add { border-color: var(--accent); color: var(--accent); font-size: 1.3rem; }
    .icon.added { background: var(--ok); border-color: var(--ok); color: var(--field); font-weight: 700; }
    .icon.remove { color: var(--muted); }

    .link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer; text-decoration: underline; }
    .hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
    .manual { margin-top: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
    .manual input + input { margin-top: 8px; }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
    button.small { padding: 10px 16px; border-radius: 10px; border: 0; font-weight: 700; color: var(--on-accent, #fff); background: var(--accent2); cursor: pointer; font-size: .95rem; }
    .empty { color: var(--muted); font-size: .9rem; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; margin-top: 6px; }

    button.submit { width: 100%; margin-top: 20px; padding: 14px; font-size: 1.05rem; font-weight: 700; color: #fff; border: 0; border-radius: 12px; cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    button.submit:disabled { opacity: .6; cursor: wait; }
    #msg { margin-top: 14px; min-height: 1.4em; text-align: center; font-weight: 600; }
    #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
    .count { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 18px; }
  </style>
</head>
<body>
<button type="button" class="theme-toggle" id="themeToggle"></button>
<main>
  <img class="poster poster-light" src="/background.jpg" alt="" onload="document.body.classList.add('has-poster')" onerror="this.remove()">
  <img class="poster poster-dark" src="/background-dark.jpg" alt="" onerror="this.remove()">
  <div class="intro">
    <h1>🎶 Request songs for <span class="event-name">the party</span></h1>
    <p class="sub">Search, tap ▶ to hear a preview, and tap + to add songs to your list. Send them all in one go.</p>
  </div>

  <form id="f" autocomplete="off" novalidate>
    <label for="q">Search for a song</label>
    <div class="search">
      <input id="q" type="search" placeholder="Song or artist, e.g. One More Time" enterkeyhint="search"
             role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul id="results" class="songs results" role="listbox" hidden></ul>
    </div>
    <p class="hint" id="manualHint">Can't find it? <button type="button" class="link" id="manualBtn">Type it in yourself</button></p>

    <div class="manual" id="manualBox" hidden>
      <input id="artist" maxlength="120" placeholder="Artist, e.g. Daft Punk" aria-label="Artist">
      <input id="title" maxlength="160" placeholder="Song title, e.g. One More Time" aria-label="Song title">
      <div class="row">
        <button type="button" class="small" id="manualAdd">Add to list</button>
        <button type="button" class="link" id="manualCancel">Cancel</button>
      </div>
    </div>

    <div class="label">Your list <span id="listCount" class="opt"></span></div>
    <ul id="mine" class="songs" hidden></ul>
    <div id="emptyList" class="empty">Your list is empty. Search above and tap + to add songs.</div>

    <label for="name">Your name <span class="opt">(optional)</span></label>
    <input id="name" maxlength="60" placeholder="So the DJ can shout you out">

    <label for="note">Note for the DJ <span class="opt">(optional)</span></label>
    <textarea id="note" maxlength="200" placeholder="Remixes, versions, the perfect moment to play them…"></textarea>

    <input class="hp" id="website" tabindex="-1" aria-hidden="true">

    <button class="submit" id="btn" type="submit">Send my list</button>
    <div id="msg" role="status"></div>
  </form>
  <p class="count" id="count"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const q = $('q'), results = $('results'), mine = $('mine'), msg = $('msg');
  const MAX_SONGS = 30;
  let tracks = [];      // current search results
  let myList = [];      // [{ key, track } or { key, artist, title }]
  let active = -1;
  let timer, searchSeq = 0;
  let sentTotal = 0;

  // ---------- remember the guest's name and unsent list ----------
  try {
    $('name').value = localStorage.getItem('guestName') || '';
    myList = JSON.parse(localStorage.getItem('songList') || '[]');
  } catch {}
  const saveList = () => { try { localStorage.setItem('songList', JSON.stringify(myList)); } catch {} };

  // ---------- settings from the server ----------
  const config = fetch('/api/config').then((r) => r.json()).catch(() => ({}));
  config.then((c) => {
    if (!c.eventName) return;
    document.querySelector('.event-name').textContent = c.eventName;
    document.title = 'Song Requests · ' + c.eventName;
  });

  // ---------- previews: one player for the whole page ----------
  const player = new Audio();
  let playingUrl = '';
  function syncPlayButtons() {
    document.querySelectorAll('[data-preview]').forEach((b) => {
      const on = b.dataset.preview === playingUrl;
      b.classList.toggle('playing', on);
      b.textContent = on ? '❚❚' : '▶';
      b.setAttribute('aria-label', on ? 'Stop preview' : 'Play preview');
    });
  }
  function togglePreview(url) {
    if (playingUrl === url) { player.pause(); return; }
    playingUrl = url;
    player.src = url;
    player.play().catch(() => { playingUrl = ''; syncPlayButtons(); });
    syncPlayButtons();
  }
  player.addEventListener('pause', () => { playingUrl = ''; syncPlayButtons(); });
  player.addEventListener('ended', () => { playingUrl = ''; syncPlayButtons(); });
  const cover = (t) => t?.artwork ? `<img class="art" src="${esc(t.artwork)}" alt="" loading="lazy">` : '<div class="art" aria-hidden="true">♪</div>';
  const playButton = (t) => t?.previewUrl
    ? `<button type="button" class="icon" data-preview="${esc(t.previewUrl)}" aria-label="Play preview">▶</button>` : '';

  // ---------- song search, straight from the guest's phone (free, no account or key) ----------
  // Deezer first: its results include explicit versions and 30-second previews.
  // Apple's iTunes search is the backup (it has been leaving explicit versions out since late 2025).
  // Both are loaded via JSONP, the method each documents for use from web pages.
  let jsonpSeq = 0;
  function jsonp(src) {
    return new Promise((resolve, reject) => {
      const cb = '__songs' + ++jsonpSeq;
      const script = document.createElement('script');
      const done = () => { window[cb] = () => {}; script.remove(); clearTimeout(timeout); };
      const timeout = setTimeout(() => { done(); reject(new Error('timeout')); }, 8000);
      window[cb] = (data) => { done(); resolve(data); };
      script.onerror = () => { done(); reject(new Error('network')); };
      script.src = src + '&callback=' + cb;
      document.head.appendChild(script);
    });
  }

  const fromDeezer = (d) => ({
    source: 'deezer', id: String(d.id), artist: d.artist?.name || '', title: d.title || d.title_short || '',
    album: d.album?.title || '', artwork: d.album?.cover_medium || '', durationMs: (d.duration || 0) * 1000,
    // explicit_content_lyrics: 1 = explicit, 3 = edited (clean)
    explicit: d.explicit_lyrics === true || d.explicit_content_lyrics === 1,
    clean: !d.explicit_lyrics && d.explicit_content_lyrics === 3,
    url: d.link || '', previewUrl: d.preview || '',
  });
  const fromApple = (r) => ({
    source: 'apple', id: String(r.trackId), artist: r.artistName, title: r.trackName, album: r.collectionName || '',
    artwork: (r.artworkUrl100 || '').replace('100x100bb', '120x120bb'), durationMs: r.trackTimeMillis || 0,
    explicit: r.trackExplicitness === 'explicit', clean: r.trackExplicitness === 'cleaned',
    url: r.trackViewUrl || '', previewUrl: r.previewUrl || '',
  });

  async function deezerSearch(term) {
    const { deezerApi = 'https://api.deezer.com' } = await config;
    const data = await jsonp(`${deezerApi}/search?q=${encodeURIComponent(term)}&limit=40&output=jsonp`);
    if (!Array.isArray(data?.data)) throw new Error('Deezer search failed');
    return data.data.filter((d) => d.type === 'track' && d.id).map(fromDeezer);
  }
  async function appleSearch(term) {
    const { musicApi = 'https://itunes.apple.com', musicCountry = 'US' } = await config;
    const data = await jsonp(`${musicApi}/search?media=music&entity=song&explicit=Yes&limit=40&country=${encodeURIComponent(musicCountry)}&term=${encodeURIComponent(term)}`);
    return (data.results || []).filter((r) => r.kind === 'song' && r.trackId).map(fromApple);
  }

  // Show each song once: explicit version first with the clean version right under it,
  // and no repeat copies from other albums.
  const norm = (s) => s.toLowerCase().replace(/[\(\[](clean|explicit|edited)( version)?[\)\]]/g, '').replace(/[^\p{L}\p{N}]+/gu, '');
  const songKey = (t) => norm(t.artist) + '|' + norm(t.title);
  function explicitFirst(list) {
    const songs = new Map();
    for (const t of list) {
      if (!songs.has(songKey(t))) songs.set(songKey(t), []);
      songs.get(songKey(t)).push(t);
    }
    return [...songs.values()].flatMap((versions) => {
      const explicit = versions.find((t) => t.explicit);
      const clean = versions.find((t) => t.clean);
      return explicit ? [explicit, clean].filter(Boolean) : [versions.find((t) => !t.clean) || clean];
    });
  }
  const badge = (t) => (t?.explicit ? '<span class="e" title="Explicit">E</span>' : t?.clean ? '<span class="clean">Clean</span>' : '');

  async function search(term) {
    const seq = ++searchSeq;
    try {
      const found = await deezerSearch(term).catch(() => appleSearch(term));
      if (seq !== searchSeq) return; // a newer search is on its way
      tracks = explicitFirst(found).slice(0, 12);
      active = -1; renderResults();
    } catch {
      if (seq === searchSeq) showInfo('Search is having a moment. You can still', true);
    }
  }

  // ---------- search results ----------
  const trackKey = (t) => (t.source || 'apple') + t.id;
  const keyOf = (s) => s.track ? trackKey(s.track) : 'm' + (s.artist + '|' + s.title).toLowerCase();
  const inList = (key) => myList.some((s) => s.key === key);

  function closeResults() { results.hidden = true; q.setAttribute('aria-expanded', 'false'); active = -1; }
  function showInfo(text, withManual) {
    results.innerHTML = `<li class="info">${esc(text)}${withManual ? ' <button type="button" class="link" data-manual>type it in yourself</button>' : ''}</li>`;
    results.hidden = false;
  }

  function renderResults() {
    if (!tracks.length) return showInfo('No songs found. Try different words, or', true);
    results.innerHTML = tracks.map((t, i) => {
      const added = inList(trackKey(t));
      return `<li role="option" data-i="${i}" class="${i === active ? 'active' : ''}" aria-selected="${added}">
        ${cover(t)}
        <div class="meta"><b>${esc(t.title)}${badge(t)}</b><span>${esc(t.artist)}${t.album ? ' · ' + esc(t.album) : ''}</span></div>
        ${playButton(t)}
        <span class="icon ${added ? 'added' : 'add'}" aria-hidden="true">${added ? '✓' : '+'}</span>
      </li>`;
    }).join('');
    results.hidden = false;
    q.setAttribute('aria-expanded', 'true');
    syncPlayButtons();
  }

  // Tapping a result adds it to the list, tapping it again takes it out.
  function toggleTrack(t) {
    const key = trackKey(t);
    if (inList(key)) removeFromList(key);
    else addToList({ key, track: t });
    renderResults();
  }

  // ---------- your list ----------
  function addToList(song) {
    msg.textContent = '';
    if (inList(song.key)) return;
    if (myList.length >= MAX_SONGS) {
      msg.className = 'err';
      msg.textContent = `That's ${MAX_SONGS} songs! Send this list first, then start another.`;
      return;
    }
    myList.push(song);
    saveList(); renderList();
  }
  function removeFromList(key) {
    myList = myList.filter((s) => s.key !== key);
    saveList(); renderList();
  }

  function renderList() {
    const n = myList.length;
    $('listCount').textContent = n ? `(${n})` : '';
    $('emptyList').hidden = n > 0;
    mine.hidden = n === 0;
    $('btn').textContent = n ? `Send ${n} song${n === 1 ? '' : 's'}` : 'Send my list';
    mine.innerHTML = myList.map((s) => {
      const t = s.track;
      return `<li>
        ${cover(t)}
        <div class="meta"><b>${esc(t ? t.title : s.title)}${badge(t)}</b><span>${esc(t ? t.artist : s.artist)}${t ? '' : ' · typed in'}</span></div>
        ${playButton(t)}
        <button type="button" class="icon remove" data-remove="${esc(s.key)}" aria-label="Remove from list">✕</button>
      </li>`;
    }).join('');
    syncPlayButtons();
  }

  // ---------- events ----------
  q.addEventListener('input', () => {
    clearTimeout(timer);
    const term = q.value.trim();
    if (term.length < 2) { searchSeq++; return closeResults(); }
    showInfo('Searching…');
    timer = setTimeout(() => search(term), 300);
  });
  q.addEventListener('focus', () => { if (tracks.length && q.value.trim().length >= 2) renderResults(); });
  q.addEventListener('keydown', (e) => {
    if (results.hidden || !tracks.length) return;
    if (e.key === 'ArrowDown') { active = Math.min(active + 1, tracks.length - 1); renderResults(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); renderResults(); e.preventDefault(); }
    else if (e.key === 'Enter') { e.preventDefault(); toggleTrack(tracks[Math.max(active, 0)]); }
    else if (e.key === 'Escape') closeResults();
  });

  document.addEventListener('click', (e) => {
    const preview = e.target.closest('[data-preview]');
    if (preview) return togglePreview(preview.dataset.preview);
    if (e.target.closest('[data-manual]')) return openManual();
    const remove = e.target.closest('[data-remove]');
    if (remove) { removeFromList(remove.dataset.remove); if (!results.hidden && tracks.length) renderResults(); return; }
    const li = e.target.closest('#results li[data-i]');
    if (li) return toggleTrack(tracks[+li.dataset.i]);
    if (!e.target.closest('.search')) closeResults();
  });

  function openManual() {
    // Pre-fill the title with whatever they searched for.
    if (q.value.trim() && !$('title').value) $('title').value = q.value.trim();
    closeResults();
    $('manualBox').hidden = false; $('manualHint').hidden = true;
    $('artist').focus();
  }
  function closeManual() {
    $('artist').value = ''; $('title').value = '';
    $('manualBox').hidden = true; $('manualHint').hidden = false;
  }
  function addManual() {
    const artist = $('artist').value.trim(), title = $('title').value.trim();
    if (!artist || !title) {
      msg.className = 'err'; msg.textContent = 'Please fill in both artist and song title.';
      return false;
    }
    addToList({ key: keyOf({ artist, title }), artist, title });
    closeManual();
    return true;
  }
  $('manualBtn').addEventListener('click', openManual);
  $('manualCancel').addEventListener('click', closeManual);
  $('manualAdd').addEventListener('click', addManual);
  [$('artist'), $('title')].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addManual(); } }));

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    // A typed-in song they forgot to add counts too.
    if (!$('manualBox').hidden && ($('artist').value.trim() || $('title').value.trim()) && !addManual()) return;
    if (!myList.length) {
      msg.className = 'err'; msg.textContent = 'Add at least one song to your list first.';
      return;
    }
    const songs = myList.map((s) => (s.track ? { track: s.track } : { artist: s.artist, title: s.title }));
    const data = { songs, name: $('name').value, note: $('note').value, website: $('website').value };
    $('btn').disabled = true;
    msg.className = ''; msg.textContent = '';
    try {
      const res = await fetch('/api/requests', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Something went wrong.');
      try { localStorage.setItem('guestName', data.name || ''); } catch {}
      player.pause();
      sentTotal += songs.length;
      msg.className = 'ok';
      msg.textContent = `✅ ${songs.length} song${songs.length === 1 ? '' : 's'} sent to the DJ! You can add more anytime.`;
      $('count').textContent = `You've requested ${sentTotal} song${sentTotal === 1 ? '' : 's'} so far.`;
      myList = []; saveList(); renderList();
      q.value = ''; $('note').value = ''; tracks = []; closeResults();
    } catch (err) {
      msg.className = 'err';
      msg.textContent = err.message;
    } finally {
      $('btn').disabled = false;
    }
  });

  // ---------- light / dark switch ----------
  function showTheme() {
    const dark = document.documentElement.dataset.theme !== 'light';
    $('themeToggle').textContent = dark ? '☀️' : '🌙';
    $('themeToggle').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  $('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch {}
    showTheme();
  });
  showTheme();

  renderList();
</script>
</body>
</html>
